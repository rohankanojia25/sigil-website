<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Docs | Sigil</title>
  <meta name="description" content="Sigil documentation: every command, flag and supported chain, and how to wire Sigil into your Foundry or Hardhat pipeline." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://sigil-website.vercel.app/docs/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --void:#060709; --line:rgba(255,255,255,0.07); --line-2:rgba(255,255,255,0.13);
      --white:#F2F4F8; --gray:#8B93A4; --cobalt:#5B8CFF; --cobalt-2:#3D6BF3;
      --display:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',monospace; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:var(--void); color:var(--white); font-family:var(--body); min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
    a { color:inherit; text-decoration:none; }
    a:focus-visible { outline:2px solid var(--cobalt); outline-offset:3px; border-radius:6px; }
    .atmo { position:fixed; inset:0; pointer-events:none; background:radial-gradient(800px 460px at 50% -12%, rgba(91,140,255,0.12), transparent 65%); }
    .nav { position:sticky; top:0; z-index:50; background:rgba(6,7,9,0.62); backdrop-filter:blur(18px); border-bottom:1px solid var(--line); }
    .nav-inner { max-width:1280px; margin:0 auto; padding:14px 36px; display:flex; align-items:center; gap:28px; }
    .wordmark { display:flex; align-items:center; gap:10px; font-family:var(--display); font-weight:700; font-size:15px; letter-spacing:0.26em; }
    .mark { color:var(--cobalt); filter:drop-shadow(0 0 10px rgba(91,140,255,0.5)); }
    .nav-links { display:flex; gap:24px; margin-left:auto; }
    .nav-links a { font-size:13.5px; font-weight:500; color:var(--gray); transition:color .18s; }
    .nav-links a:hover { color:var(--white); }
    main { flex:1; display:flex; align-items:center; justify-content:center; text-align:center; padding:80px 24px; position:relative; }
    .crumb { font-family:var(--mono); font-size:12px; color:var(--cobalt); letter-spacing:.1em; margin-bottom:26px; display:block; }
    h1 { font-family:var(--display); font-weight:700; letter-spacing:-0.04em; line-height:1;
      font-size:clamp(64px, 12vw, 150px);
      background:linear-gradient(120deg,#FFFFFF 15%,#9DB9FF 70%); -webkit-background-clip:text; background-clip:text; color:transparent;
      margin-bottom:26px; }
    .sub { color:var(--gray); font-size:16px; max-width:48ch; margin:0 auto 38px; }
    .row { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
    .btn { display:inline-flex; align-items:center; padding:12px 26px; border-radius:10px; font-size:14px; font-weight:600; border:1px solid transparent; transition:.18s; }
    .btn-cobalt { background:linear-gradient(180deg,var(--cobalt),var(--cobalt-2)); color:#fff; box-shadow:0 0 0 1px rgba(157,185,255,0.35) inset, 0 8px 26px rgba(61,107,243,0.32); }
    .btn-cobalt:hover { transform:translateY(-1px); }
    .btn-ghost { background:rgba(255,255,255,0.03); border-color:var(--line-2); color:var(--white); }
    .btn-ghost:hover { border-color:rgba(91,140,255,0.5); color:var(--cobalt); }
    .footer { border-top:1px solid var(--line); padding:26px 36px; text-align:center; font-family:var(--mono); font-size:11px; color:var(--gray); opacity:.7; }
    @media (prefers-reduced-motion: reduce){ .btn-cobalt:hover{ transform:none; } }
  </style>
</head>
<body>
  <div class="atmo" aria-hidden="true"></div>
  <header class="nav">
    <div class="nav-inner">
      <a class="wordmark" href="/" aria-label="Sigil home">
        <svg class="mark" width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M17 5.5H9.5a3 3 0 0 0 0 6h5a3 3 0 0 1 0 6H7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="19" cy="18.5" r="1.4" fill="currentColor"/></svg>
        <span>SIGIL</span>
      </a>
      <nav class="nav-links" aria-label="Primary">
        <a href="/#product">Product</a>
        <a href="/#how">How it works</a>
        <a href="/#roadmap">Roadmap</a>
        <a href="/litepaper/">Litepaper</a>
        <a href="/docs/">Docs</a>
      </nav>
      <div style="display:flex; gap:10px;">
        <a href="https://github.com" target="_blank" rel="noreferrer" style="display:inline-flex;align-items:center;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;border:1px solid rgba(255,255,255,0.14);color:#F2F4F8;background:rgba(255,255,255,0.03);text-decoration:none;">GitHub</a>
        <a href="/try" style="display:inline-flex;align-items:center;padding:8px 16px;border-radius:9px;font-size:13px;font-weight:600;color:#fff;background:linear-gradient(180deg,#5B8CFF,#3D6BF3);text-decoration:none;box-shadow:0 0 0 1px rgba(157,185,255,0.35) inset;">Try it live</a>
      </div>
    </div>
  </header>
  <main>
    <div>
      <span class="crumb">/docs</span>
      <h1>Coming soon</h1>
      <p class="sub">Every command, every flag, every supported chain. The docs ship alongside the CLI's first public release.</p>
      <div class="row">
        <a class="btn btn-cobalt" href="/try">Try Sigil live</a>
        <a class="btn btn-ghost" href="/">Back home</a>
      </div>
    </div>
  </main>
  <footer class="footer">SIGIL · open source · no token</footer>
</body>
</html>
